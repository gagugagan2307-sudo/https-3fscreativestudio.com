<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3FS Creative Studio — Management Dashboard</title>
<style>
:root{--bg:#050b15;--panel:#0b1628;--panel2:#0e1c31;--line:#263750;--gold:#f5b51b;--gold2:#ffd13b;--text:#f6f8fc;--muted:#9ba9bf;--red:#e51b35;--green:#13c98a;--blue:#1687ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% 0,#142643 0,#050b15 42%,#03070e 100%);color:var(--text);font:14px/1.45 Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{height:78px;border-bottom:1px solid #4b4328;display:flex;align-items:center;padding:0 18px;gap:28px;background:#060c16;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;min-width:300px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:50%;background:#fff}.brand strong{font-size:34px}.brand small{display:block;color:var(--gold2);font-size:16px;font-weight:700}.toplinks{display:flex;gap:12px;align-items:center;font-size:16px}.toplinks b{color:var(--gold)}.motto{flex:1;text-align:center;color:var(--gold2);font-weight:700;font-style:italic;font-size:17px}.admin{white-space:nowrap}.logout{margin-left:10px;background:#17253b;color:#fff;border:1px solid #34445f;border-radius:8px;padding:7px 10px}
.layout{display:grid;grid-template-columns:235px minmax(600px,1fr) 390px;min-height:calc(100vh - 78px)}aside{border-right:1px solid var(--line);padding:22px 12px;background:rgba(4,11,21,.82)}.nav{display:flex;align-items:center;gap:14px;padding:13px 16px;margin:4px 0;border-radius:12px;color:#c8d3e5;font-size:16px;cursor:pointer}.nav:hover{background:#122039}.nav.active{background:linear-gradient(90deg,#ffcf39,#e8a812);color:#111827;font-weight:800}.nav .ico{width:24px;text-align:center;font-size:20px}.nav.open{margin-bottom:0}.subnav{padding:5px 8px 8px 42px}.subnav div{color:#b9c7dc;padding:6px 0;cursor:pointer;font-size:13px}.subnav div:hover{color:#ffd13b}
.main{padding:28px 30px;min-width:0}.title{display:flex;align-items:center;gap:14px}.bigico{font-size:38px;color:var(--gold2)}h1{font-size:32px;margin:0}h1+div{color:#aebbd0;font-size:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:24px 0 26px}.card{background:linear-gradient(135deg,#0c1730,#0a1425);border:1px solid var(--line);border-radius:15px;padding:18px;min-height:104px}.card .label{color:#c4cde0;font-size:13px}.card .num{font-size:29px;font-weight:800;margin-top:8px}.purple{border-color:#5931a8}.green{border-color:#087a5a}.blue{border-color:#12599c}.orange{border-color:#945114}
.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}.sectionhead h2{margin:0;font-size:23px}.table{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(8,19,34,.85)}.thead,.row{display:grid;grid-template-columns:1.8fr .6fr 2fr 1fr;align-items:center}.thead{padding:13px 22px;background:#0d1b30;color:#c6d4e8}.row{padding:10px 22px;border-top:1px solid var(--line);min-height:65px}.person{display:flex;align-items:center;gap:13px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:800;background:linear-gradient(135deg,#6d28d9,#a855f7)}.person b{display:block}.person small,.sub{color:#a6b3c8;display:block}.count{background:#321c88;border-radius:10px;padding:4px 12px;width:max-content;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 11px;color:#fff}.view{background:#193455}.edit{background:#ffbd25;color:#111}.del{background:#dc1028}.add{background:linear-gradient(135deg,#ffcf3d,#edae13);border:0;border-radius:10px;padding:12px 18px;font-weight:800;color:#111}.secondary{background:#1b2c45;color:#fff;border:1px solid #34455f;border-radius:9px;padding:9px 12px}.search{background:#07101d;border:1px solid #34455f;color:#fff;padding:10px 12px;border-radius:9px;min-width:220px}.overview{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.mini{background:#0b182b;border:1px solid #273750;border-radius:9px;padding:12px 7px;text-align:center;cursor:pointer}.mini:hover{border-color:#d99e18}.mini b{display:block}.mini strong{display:block;font-size:20px;margin-top:5px}.foot{border-top:1px solid #3b3b2b;text-align:center;padding:18px;color:#e5e7eb;margin-top:20px}
.right{border-left:1px solid var(--line);padding:25px 18px;background:rgba(4,11,21,.65)}.report{border:1px solid #273750;border-radius:15px;background:linear-gradient(145deg,#0d1b2e,#081323);padding:16px;margin-top:15px}.tabs{display:flex;background:#14233a;border-radius:10px;padding:3px;margin:12px 0}.tabs span{flex:1;text-align:center;padding:9px 4px;border-radius:8px;color:#c5d1e3;cursor:pointer}.tabs .sel{background:#ffc52d;color:#111;font-weight:800}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border:1px solid #30415b;border-radius:12px;padding:13px}.metric b{font-size:23px;display:block;margin-top:5px}.up{color:var(--green);font-size:11px}.donut{width:135px;height:135px;border-radius:50%;background:conic-gradient(#8246ee 0 25%,#1593ef 25% 45%,#10b981 45% 65%,#f59e0b 65% 80%,#e22ca8 80% 100%);position:relative;margin:12px auto}.donut:after{content:"";position:absolute;inset:34px;background:#0b1628;border-radius:50%}.legend{font-size:12px;display:grid;gap:5px}.chart{height:180px;display:flex;align-items:end;gap:13px;padding:20px 10px 25px;border-bottom:1px solid #2b3a50}.bar{flex:1;display:flex;align-items:end;gap:3px;height:100%}.bar i{display:block;width:50%;border-radius:4px 4px 0 0}.q{height:45%;background:#8b4de8}.p{height:65%;background:#f2b51d}.b2{height:45%}.b3{height:60%}.b4{height:72%}.b5{height:84%}.b6{height:96%}.xlabel{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:space-around;color:#8392a9;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;place-items:center;z-index:50}.modal.show{display:grid}.modalbox{width:min(680px,94vw);max-height:90vh;overflow:auto;background:#0b1729;border:1px solid #3b4a63;border-radius:16px;padding:22px;box-shadow:0 20px 80px #000}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{background:#07101d;border:1px solid #34455f;color:#fff;padding:11px;border-radius:9px;width:100%}.field textarea{min-height:85px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.cancel{background:#26354b;color:#fff;border:0;padding:10px 15px;border-radius:8px}.save{background:#ffc52d;border:0;padding:10px 15px;border-radius:8px;font-weight:800}.notice{background:#10233d;border:1px solid #2c4869;border-radius:10px;padding:10px;color:#c9d7eb;margin-bottom:12px}.members{margin-top:14px;border:1px solid #2c3d56;border-radius:12px;padding:12px;background:#081321}.memberline{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #263750;padding:9px 0}.memberline:last-child{border-bottom:0}.pill{padding:4px 8px;border-radius:8px;background:#173252;color:#d7e4f6;font-size:12px}
.portal{position:fixed;right:22px;top:92px;z-index:15}.portal button{background:linear-gradient(135deg,#ffd13b,#e9a90e);border:0;border-radius:10px;padding:12px 20px;font-weight:800;color:#111;box-shadow:0 8px 25px #0008}
.themeBtn{background:#17253b;color:#fff;border:1px solid #34455f;border-radius:8px;padding:7px 10px}.notify{position:fixed;right:18px;top:78px;width:min(380px,92vw);z-index:70;background:#0b1729;border:1px solid #3a4b66;border-radius:14px;box-shadow:0 18px 55px #000b;display:none;padding:14px}.notify.show{display:block}.notify h3{margin:0 0 8px}.nitem{padding:10px;border-top:1px solid #263750}.nitem:first-of-type{border-top:0}.badge{background:#e51b35;color:#fff;border-radius:999px;padding:2px 6px;font-size:10px}.historyline{display:grid;grid-template-columns:130px 120px 1fr;gap:12px;padding:10px 0;border-top:1px solid #263750}.themeMenu{position:fixed;right:18px;top:125px;z-index:65;background:#0b1729;border:1px solid #3a4b66;border-radius:12px;padding:10px;display:none}.themeMenu.show{display:grid;gap:7px}.themeMenu button{border:1px solid #34455f;background:#17253b;color:#fff;border-radius:8px;padding:8px 12px;text-align:left}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.money{color:#ffd13b;font-weight:800}.statusdone{color:#13c98a;font-weight:800}.statusnot{color:#ffb52b;font-weight:800}.toast{position:fixed;right:20px;bottom:20px;background:#10233d;border:1px solid #34516f;color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:80}.toast.show{display:block}
@media(max-width:1100px){.layout{grid-template-columns:190px 1fr}.right{display:none}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.top{height:auto;padding:10px;flex-wrap:wrap}.brand{min-width:auto}.brand strong{font-size:25px}.brand img{width:45px;height:45px}.toplinks,.motto{display:none}.layout{display:block}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{white-space:nowrap}.subnav{display:none}.main{padding:18px 12px}.cards{grid-template-columns:1fr 1fr;gap:9px}.thead{display:none}.row{grid-template-columns:1fr auto;gap:8px;padding:12px}.row>div:nth-child(2),.row>div:nth-child(3){display:none}.overview{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}.grid2{grid-template-columns:1fr}.portal{top:auto;bottom:15px;right:15px}.search{min-width:0;width:100%}.sectionhead{align-items:stretch;flex-direction:column}}
</style></head>
<body>
<div class="portal"><button id="portalBtn">Open 3FS Portal</button></div>
<header class="top"><div class="brand"><img src="3fs-logo.jpg" alt="3FS Creative Studio"><div><strong>3FS</strong><small>Creative Studio</small></div></div><div class="toplinks"><span>Create</span><b>•</b><span>Connect</span><b>•</b><span>Grow</span></div><div class="motto">Every Frame Feels the Story</div><div class="admin">🔔 <button class="logout" id="notifyBtn" title="Notifications">Notifications <span id="notifyBadge" class="badge">0</span></button> <button class="themeBtn" id="themeBtn">Theme</button> 👤 <b>Admin</b><button class="logout" id="logoutBtn">Logout</button></div></header>
<div class="layout"><aside id="sidebar"></aside><main class="main"><div id="content"></div><div class="foot">© 2026 3FS Creative Studio | Create • Connect • Grow | Every Frame Feels the Story</div></main><aside class="right" id="right"></aside></div>
<div class="modal" id="modal"><div class="modalbox"><h3 id="modalTitle">Add</h3><div class="notice" id="modalNotice">All fields are custom editable. Changes are saved in this browser.</div><div id="form"></div><div class="modalactions"><button class="cancel" id="cancelBtn">Cancel</button><button class="save" id="saveBtn">Save Changes</button></div></div></div>
<div class="notify" id="notifyPanel"></div><div class="themeMenu" id="themeMenu"><button data-theme="midnight">Midnight Gold</button><button data-theme="aurora">Aurora Mix</button><button data-theme="royal">Royal Violet</button><button data-theme="sunset">Sunset Creative</button></div><div class="toast" id="toast"></div>
<script>
const KEY='3fsCreativeDataV3';
const defaultTeams=[
 {name:'DHANUSH',role:'Creative Web Development',service:'Web Development & Design',desc:'Modern websites & digital solutions',members:[{name:'Dhanush',role:'Lead Developer',contact:''},{name:'Web Associate',role:'Developer',contact:''}]},
 {name:'AMULYA',role:'Branding & Design',service:'Logo & Brand Identity Design',desc:'Turning ideas into visual identity',members:[{name:'Amulya',role:'Brand Designer',contact:''},{name:'Design Associate',role:'Designer',contact:''}]},
 {name:'KOUSHIK',role:'Social Media',service:'Social Media Handling',desc:'Engaging brands online',members:[{name:'Koushik',role:'Social Media Lead',contact:''},{name:'Content Associate',role:'Creator',contact:''}]},
 {name:'TEJAS',role:'Business Strategy',service:'Business Strategy',desc:'Growth plans for modern businesses',members:[{name:'Tejas',role:'Strategy Lead',contact:''},{name:'Business Associate',role:'Strategist',contact:''}]},
 {name:'ADITYA',role:'Analytics & Performance',service:'Analytics & Performance',desc:'Data-driven growth insights',members:[{name:'Aditya',role:'Analytics Lead',contact:''},{name:'Data Associate',role:'Analyst',contact:''}]},
 {name:'RANJITHA',role:'Creative Support',service:'Creative Support',desc:'Design & content assistance',members:[{name:'Ranjitha',role:'Creative Support',contact:''}]},
 {name:'GAGAN',role:'Strategy & Coordination',service:'Strategy & Coordination',desc:'Team support & project flow',members:[{name:'Gagan',role:'Coordinator',contact:''}]}
];
const defaults={teams:defaultTeams,clients:[{name:'ABC Enterprises',service:'Brand Strategy',status:'Active',contact:'+91 90000 00001'},{name:'Nova Media',service:'Website & Branding',status:'Active',contact:'+91 90000 00002'},{name:'GreenLeaf Foods',service:'Social Media',status:'Lead',contact:'+91 90000 00003'}],projects:[{name:'ABC Website',client:'ABC Enterprises',service:'Web Development',status:'In Progress',date:'2026-08-20',income:85000,revenue:45000,payment:'Partial'},{name:'Nova Brand Identity',client:'Nova Media',service:'Branding & Design',status:'Completed',date:'2026-07-15',income:42000,revenue:42000,payment:'Paid'},{name:'GreenLeaf Campaign',client:'GreenLeaf Foods',service:'Social Media',status:'Not Completed',date:'2026-09-01',income:30000,revenue:0,payment:'Pending'}],services:[{name:'Web Development & Design',desc:'Modern websites and digital solutions',price:25000,status:'Active'},{name:'Logo & Brand Identity Design',desc:'Turning ideas into visual identity',price:12000,status:'Active'},{name:'Social Media Handling',desc:'Engaging brands online',price:15000,status:'Active'},{name:'Business Strategy',desc:'Growth plans for modern businesses',price:18000,status:'Active'},{name:'Analytics & Performance',desc:'Data-driven growth insights',price:10000,status:'Active'}],enquiries:[{name:'Website Enquiry',client:'ABC Enterprises',message:'Need a modern company website',status:'New',date:'2026-08-25'},{name:'Branding Enquiry',client:'Nova Media',message:'Logo and identity package',status:'Contacted',date:'2026-08-24'}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){let raw=localStorage.getItem(KEY);if(raw){try{return normalize(JSON.parse(raw))}catch(e){}}let old=localStorage.getItem('3fsData');if(old){try{return migrate(JSON.parse(old))}catch(e){}}return clone(defaults)}
function migrate(o){let n=clone(defaults);['clients','projects','services','enquiries'].forEach(k=>{if(Array.isArray(o[k]))n[k]=o[k].map(x=>{if(!Array.isArray(x))return x; if(k==='clients')return {name:x[0],service:x[1],status:x[2],contact:x[3]};if(k==='projects')return {name:x[0],client:x[1],service:x[2],status:x[3],date:x[4]};if(k==='services')return {name:x[0],desc:x[1],status:x[2]};return {name:x[0],client:x[1],message:x[2],status:x[3],date:x[4]}})});if(Array.isArray(o.teams))n.teams=o.teams.map(x=>Array.isArray(x)?{name:x[0],role:x[1],service:x[2],desc:x[3],members:Array.from({length:+x[4]||1},(_,i)=>({name:i===0?x[0]:'Team Member '+(i+1),role:'Member',contact:''}))}:x);return normalize(n)}
function normalize(o){o=Object.assign(clone(defaults),o);o.teams=(o.teams||[]).map(t=>Object.assign({members:[]},t,{members:Array.isArray(t.members)?t.members:[]}));o.history=Array.isArray(o.history)?o.history:[];o.reportSnapshots=Array.isArray(o.reportSnapshots)?o.reportSnapshots:[];o.notifications=Array.isArray(o.notifications)?o.notifications:[];o.services=(o.services||[]).map(x=>Object.assign({price:0},x));o.projects=(o.projects||[]).map(x=>Object.assign({income:0,revenue:0,payment:'Pending'},x));return o}
let store=loadData();let section='dashboard',editIndex=-1,modalMode='record',teamIndex=-1,memberIndex=-1;
function persist(){localStorage.setItem(KEY,JSON.stringify(store))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function nav(){const items=[['dashboard','⌂','Dashboard'],['clients','♙','Clients'],['projects','▣','Projects'],['teams','♧','Teams'],['services','◈','Services'],['enquiries','▤','Enquiries'],['reports','▥','Reports']];document.getElementById('sidebar').innerHTML=items.map(x=>`<div class="nav ${section===x[0]?'active':''}" data-go="${x[0]}"><span class="ico">${x[1]}</span>${x[2]}</div>${x[0]==='teams'&&section==='teams'?`<div class="subnav">${store.teams.map((t,i)=>`<div data-team="${i}">• Team-${i+1}: ${esc(t.name)}</div>`).join('')}</div>`:''}`).join('');document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>viewTeam(+el.dataset.team))}
function go(s){section=s;nav();render()}
const configs={clients:{title:'3FS Clients',sub:'Manage client relationships and contact details',icon:'♙',add:'Add Client',fields:[['name','Client Name','text'],['service','Primary Service','text'],['status','Status','select:Active,Lead,Paused,Completed'],['contact','Contact','text']]},projects:{title:'3FS Projects',sub:'Track every creative project from idea to delivery',icon:'▣',add:'Add Project',fields:[['name','Project Name','text'],['client','Client','text'],['service','Service','text'],['status','Project Status','select:Not Completed,In Progress,Completed,On Hold'],['date','Due Date','date'],['income','Project Income (₹)','number'],['revenue','Revenue Generated (₹)','number'],['payment','Payment Status','select:Pending,Partial,Paid']]},services:{title:'3FS Services',sub:'Customize services and pricing offered by your studio',icon:'◈',add:'Add Service',fields:[['name','Service Name','text'],['desc','Description','textarea'],['price','Starting Price (₹)','number'],['status','Status','select:Active,Paused']]},enquiries:{title:'3FS Enquiries',sub:'Manage incoming leads and conversations',icon:'▤',add:'Add Enquiry',fields:[['name','Enquiry Title','text'],['client','Client / Contact','text'],['message','Requirement','textarea'],['status','Status','select:New,Contacted,Qualified,Closed'],['date','Date','date']]}};
function render(){if(section==='dashboard'||section==='reports')dashboard();else if(section==='teams')teamsPage();else if(section==='history')historyPage();else recordsPage(section);rightPanel()}
function dashboard(){const total=store.teams.reduce((a,t)=>a+t.members.length,0);document.getElementById('content').innerHTML=`<div class="title"><div class="bigico">▥</div><div><h1>3FS Dashboard</h1><div>Creative management at a glance — every slot is editable</div></div></div><div class="cards"><div class="card purple"><div class="label">Total Team Members</div><div class="num">${total}</div></div><div class="card green"><div class="label">Clients</div><div class="num">${store.clients.length}</div></div><div class="card blue"><div class="label">Projects</div><div class="num">${store.projects.length}</div></div><div class="card orange"><div class="label">New Enquiries</div><div class="num">${store.enquiries.filter(x=>x.status==='New').length}</div></div></div><section class="section"><div class="sectionhead"><h2>♧　Team Overview</h2><button class="add" id="manageTeams">Manage Teams</button></div><div class="overview">${store.teams.map((t,i)=>`<div class="mini" data-team="${i}"><b>Team-${i+1}: ${esc(t.name)}</b><strong>${t.members.length}</strong><small>Members</small></div>`).join('')}</div></section><section class="section"><div class="sectionhead"><h2>Quick Management</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" data-quick="clients">Clients</button><button class="secondary" data-quick="projects">Projects</button><button class="secondary" data-quick="services">Services</button><button class="secondary" data-quick="enquiries">Enquiries</button></div></div><div class="notice">Use the Edit button on any record to change every field. Team-1 through Team-7 also have their own inner-member management.</div></section>`;document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>viewTeam(+el.dataset.team));document.getElementById('manageTeams').onclick=()=>go('teams');document.querySelectorAll('[data-quick]').forEach(el=>el.onclick=()=>go(el.dataset.quick))}
function teamsPage(){document.getElementById('content').innerHTML=`<div class="sectionhead"><div class="title"><div class="bigico">♧</div><div><h1>3FS Teams</h1><div>Our Creative Force Driving Digital Growth</div></div></div><button class="add" id="addTeam">＋ Add Team</button></div><div class="cards"><div class="card purple"><div class="label">Total Team Members</div><div class="num">${store.teams.reduce((a,t)=>a+t.members.length,0)}</div></div><div class="card green"><div class="label">Active Teams</div><div class="num">${store.teams.length}</div></div><div class="card blue"><div class="label">Ongoing Projects</div><div class="num">${store.projects.filter(p=>p.status==='In Progress').length}</div></div><div class="card orange"><div class="label">Total Clients</div><div class="num">${store.clients.length}</div></div></div><section class="section"><div class="sectionhead"><h2>♧　Team Members</h2><input class="search" id="teamSearch" placeholder="Search teams or members..."></div><div class="table"><div class="thead"><div>Team Name</div><div>Members</div><div>Description</div><div>Actions</div></div><div id="teamRows">${store.teams.map((t,i)=>teamRow(t,i)).join('')}</div></div></section><section class="section"><div class="sectionhead"><h2>Team Overview</h2></div><div class="overview">${store.teams.map((t,i)=>`<div class="mini" data-team="${i}"><b>${esc(t.name)}</b><strong>${t.members.length}</strong><small>Members</small></div>`).join('')}</div></section>`;document.getElementById('addTeam').onclick=()=>openTeamModal();document.getElementById('teamSearch').oninput=e=>filterTeams(e.target.value);document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>viewTeam(+el.dataset.team));bindRows()}
function teamRow(t,i){return `<div class="row teamrow" data-search="${esc((t.name+' '+t.role+' '+t.service+' '+t.desc+' '+t.members.map(m=>m.name+' '+m.role).join(' ')).toLowerCase())}"><div class="person"><div class="avatar">${esc(t.name[0]||'?')}</div><div><b>Team-${i+1}: ${esc(t.name)}</b><small>${esc(t.role)}</small></div></div><div><span class="count">${t.members.length}</span></div><div><b style="font-weight:500">${esc(t.service)}</b><small>${esc(t.desc)}</small></div><div class="actions"><button class="btn view" data-view-team="${i}">◉</button><button class="btn edit" data-edit-team="${i}">✎</button><button class="btn del" data-del-team="${i}">🗑</button></div></div>`}
function bindRows(){document.querySelectorAll('[data-view-team]').forEach(b=>b.onclick=()=>viewTeam(+b.dataset.viewTeam));document.querySelectorAll('[data-edit-team]').forEach(b=>b.onclick=()=>openTeamModal(+b.dataset.editTeam));document.querySelectorAll('[data-del-team]').forEach(b=>b.onclick=()=>deleteTeam(+b.dataset.delTeam))}
function filterTeams(q){q=q.toLowerCase();document.querySelectorAll('.teamrow').forEach(r=>r.style.display=r.dataset.search.includes(q)?'grid':'none')}
function recordsPage(type){const c=configs[type],arr=store[type];document.getElementById('content').innerHTML=`<div class="sectionhead"><div class="title"><div class="bigico">${c.icon}</div><div><h1>${c.title}</h1><div>${c.sub}</div></div></div><button class="add" id="addRecord">＋ ${c.add}</button></div><div class="cards"><div class="card purple"><div class="label">Total Records</div><div class="num">${arr.length}</div></div><div class="card green"><div class="label">Active / Current</div><div class="num">${arr.filter(x=>x.status==='Active'||x.status==='In Progress'||x.status==='New').length}</div></div><div class="card blue"><div class="label">Records</div><div class="num">${arr.length}</div></div><div class="card orange"><div class="label">Custom Data</div><div class="num">✓</div></div></div><section class="section"><div class="sectionhead"><h2>${c.icon}　${c.title.replace('3FS ','')}</h2><input class="search" id="recordSearch" placeholder="Search..."></div><div class="table"><div class="thead"><div>Name / Title</div><div>Status</div><div>Details</div><div>Actions</div></div><div id="recordRows">${arr.map((x,i)=>recordRow(type,x,i)).join('')}</div></div></section>`;document.getElementById('addRecord').onclick=()=>openRecordModal(type);document.getElementById('recordSearch').oninput=e=>filterRecords(e.target.value);bindRecordRows(type)}
function recordRow(type,x,i){const details=Object.entries(x).filter(([k])=>k!=='name'&&k!=='status').map(([k,v])=>`<span>${esc(v)}</span>`).join(' • ');return `<div class="row recordrow" data-search="${esc(Object.values(x).join(' ').toLowerCase())}"><div class="person"><div class="avatar">${esc((x.name||'?')[0])}</div><div><b>${esc(x.name)}</b><small>${esc(type==='projects'?x.client||'':x.service||x.client||'')}</small></div></div><div><span class="count">${esc(x.status||'')}</span></div><div><span class="sub">${details}</span></div><div class="actions"><button class="btn view" data-view-record="${i}">◉</button><button class="btn edit" data-edit-record="${i}">✎</button><button class="btn del" data-del-record="${i}">🗑</button></div></div>`}
function bindRecordRows(type){document.querySelectorAll('[data-view-record]').forEach(b=>b.onclick=()=>viewRecord(type,+b.dataset.viewRecord));document.querySelectorAll('[data-edit-record]').forEach(b=>b.onclick=()=>openRecordModal(type,+b.dataset.editRecord));document.querySelectorAll('[data-del-record]').forEach(b=>b.onclick=()=>deleteRecord(type,+b.dataset.delRecord))}
function filterRecords(q){q=q.toLowerCase();document.querySelectorAll('.recordrow').forEach(r=>r.style.display=r.dataset.search.includes(q)?'grid':'none')}
function openRecordModal(type,i=-1){section=type;modalMode='record';editIndex=i;const c=configs[type],x=i<0?{}:store[type][i];document.getElementById('modalTitle').textContent=i<0?c.add:'Edit '+c.title.replace('3FS ','');document.getElementById('modalNotice').textContent='Custom editing is enabled. Change any field and press Save Changes.';document.getElementById('form').innerHTML='<div class="grid2">'+c.fields.map((f,j)=>{let v=x[f[0]]??'';if(f[2].startsWith('select:')){let opts=f[2].split(':')[1].split(',');return `<div class="field"><label>${f[1]}</label><select id="f${j}">${opts.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`}return `<div class="field"><label>${f[1]}</label>${f[2]==='textarea'?`<textarea id="f${j}">${esc(v)}</textarea>`:`<input id="f${j}" type="${f[2]}" value="${esc(v)}" placeholder="Enter ${f[1]}">`}</div>`}).join('')+'</div>';showModal()}
function saveRecord(){const c=configs[section],obj={};c.fields.forEach((f,j)=>obj[f[0]]=document.getElementById('f'+j).value.trim());if(!obj[c.fields[0][0]])return alert('Please enter '+c.fields[0][1]+'.');if(editIndex<0)store[section].push(obj);else store[section][editIndex]=obj;persist();closeModal();nav();render();toast('Saved successfully')}
function deleteRecord(type,i){if(confirm('Delete this record?')){store[type].splice(i,1);persist();render();toast('Deleted')}}
function viewRecord(type,i){const x=store[type][i];alert(configs[type].title+'\n\n'+Object.entries(x).map(([k,v])=>k.toUpperCase()+': '+v).join('\n'))}
function openTeamModal(i=-1){modalMode='team';teamIndex=i;const t=i<0?{name:'',role:'',service:'',desc:''}:store.teams[i];document.getElementById('modalTitle').textContent=i<0?'Add Team':'Edit Team';document.getElementById('modalNotice').textContent='Team details are fully editable. Inner sub-members are managed after saving the team.';document.getElementById('form').innerHTML=`<div class="grid2"><div class="field"><label>Team Name</label><input id="tname" value="${esc(t.name)}"></div><div class="field"><label>Role / Department</label><input id="trole" value="${esc(t.role)}"></div><div class="field"><label>Primary Service</label><input id="tservice" value="${esc(t.service)}"></div><div class="field"><label>Description</label><textarea id="tdesc">${esc(t.desc)}</textarea></div></div>`;showModal()}
function saveTeam(){const obj={name:document.getElementById('tname').value.trim(),role:document.getElementById('trole').value.trim(),service:document.getElementById('tservice').value.trim(),desc:document.getElementById('tdesc').value.trim(),members:teamIndex<0?[]:store.teams[teamIndex].members};if(!obj.name)return alert('Please enter Team Name.');if(teamIndex<0)store.teams.push(obj);else store.teams[teamIndex]=obj;persist();closeModal();nav();render();toast('Team saved')}
function deleteTeam(i){if(store.teams.length<=1)return alert('Keep at least one team.');if(confirm('Delete Team-'+(i+1)+' and all its inner members?')){store.teams.splice(i,1);persist();nav();render();toast('Team deleted')}}
function viewTeam(i){const t=store.teams[i];section='teams';document.getElementById('modalTitle').textContent=`Team-${i+1}: ${t.name}`;document.getElementById('modalNotice').textContent='Add, edit or delete inner sub-members for this team.';document.getElementById('form').innerHTML=`<div class="notice"><b>${esc(t.service)}</b><br>${esc(t.desc)}</div><div class="members">${t.members.length?t.members.map((m,j)=>`<div class="memberline"><div><b>${esc(m.name)}</b><br><span class="pill">${esc(m.role)}</span> ${m.contact?`<span class="pill">${esc(m.contact)}</span>`:''}</div><div class="actions"><button class="btn edit" data-edit-member="${j}">✎</button><button class="btn del" data-del-member="${j}">🗑</button></div></div>`).join(''):'<div class="sub">No inner members yet. Add the first one below.</div>'}<button class="add" id="addMember" style="margin-top:12px">＋ Add Inner Member</button></div><div class="modalactions"><button class="cancel" id="closeTeamView">Close</button><button class="secondary" id="editTeamFromView">Edit Team Details</button></div>`;showModal();document.getElementById('closeTeamView').onclick=closeModal;document.getElementById('editTeamFromView').onclick=()=>{closeModal();openTeamModal(i)};document.getElementById('addMember').onclick=()=>openMemberModal(i);document.querySelectorAll('[data-edit-member]').forEach(b=>b.onclick=()=>openMemberModal(i,+b.dataset.editMember));document.querySelectorAll('[data-del-member]').forEach(b=>b.onclick=()=>deleteMember(i,+b.dataset.delMember))}
function openMemberModal(ti,mi=-1){modalMode='member';teamIndex=ti;memberIndex=mi;const m=mi<0?{name:'',role:'',contact:''}:store.teams[ti].members[mi];document.getElementById('modalTitle').textContent=mi<0?'Add Inner Member':'Edit Inner Member';document.getElementById('modalNotice').textContent=`Team-${ti+1}: ${store.teams[ti].name}`;document.getElementById('form').innerHTML=`<div class="field"><label>Member Name</label><input id="mname" value="${esc(m.name)}"></div><div class="field"><label>Role / Position</label><input id="mrole" value="${esc(m.role)}"></div><div class="field"><label>Contact / Extra Detail</label><input id="mcontact" value="${esc(m.contact||'')}"></div>`;showModal()}
function saveMember(){const m={name:document.getElementById('mname').value.trim(),role:document.getElementById('mrole').value.trim(),contact:document.getElementById('mcontact').value.trim()};if(!m.name)return alert('Please enter Member Name.');if(memberIndex<0)store.teams[teamIndex].members.push(m);else store.teams[teamIndex].members[memberIndex]=m;persist();closeModal();nav();render();toast('Inner member saved');setTimeout(()=>viewTeam(teamIndex),50)}
function deleteMember(ti,mi){if(confirm('Delete this inner member?')){store.teams[ti].members.splice(mi,1);persist();viewTeam(ti);toast('Inner member deleted')}}
function showModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('cancelBtn').onclick=closeModal;document.getElementById('saveBtn').onclick=()=>modalMode==='record'?saveRecord():modalMode==='team'?saveTeam():saveMember();document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function rightPanel(){const c=store.clients,p=store.projects,t=store.teams,e=store.enquiries;document.getElementById('right').innerHTML=`<h2 style="margin:0;font-size:24px">▥ Reports</h2><div style="color:#aebbd0">Insights & performance</div><div class="report"><div class="tabs"><span class="sel" data-r="dashboard">Overview</span><span data-r="clients">Clients</span><span data-r="projects">Projects</span><span data-r="teams">Teams</span></div><div class="metrics"><div class="metric">👥 Clients<b>${c.length}</b><span class="up">Editable records</span></div><div class="metric">▰ Projects<b>${p.length}</b><span class="up">Editable records</span></div><div class="metric">♧ Team Members<b>${t.reduce((a,x)=>a+x.members.length,0)}</b><span class="up">Inner members included</span></div><div class="metric">◎ Enquiries<b>${e.length}</b><span class="up">Editable records</span></div></div></div><div class="report"><h3 style="margin:0">Projects by Service</h3><div class="donut"></div><div class="legend">${[...new Set(p.map(x=>x.service))].slice(0,6).map(s=>`<div>• ${esc(s)} — ${p.filter(x=>x.service===s).length}</div>`).join('')}</div></div><div class="report"><h3 style="margin:0">Enquiries & Projects</h3><div class="chart" style="position:relative"><div class="bar"><i class="q"></i><i class="p"></i></div><div class="bar"><i class="q b2"></i><i class="p b3"></i></div><div class="bar"><i class="q b3"></i><i class="p b4"></i></div><div class="bar"><i class="q b4"></i><i class="p b5"></i></div><div class="bar"><i class="q b5"></i><i class="p b6"></i></div><div class="bar"><i class="q b6"></i><i class="p b6"></i></div><div class="xlabel"><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span></div></div></div>`;document.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>go(el.dataset.r==='dashboard'?'dashboard':el.dataset.r))}
// Enhanced 3FS management features
function nav(){const items=[['dashboard','⌂','Dashboard'],['clients','♙','Clients'],['projects','▣','Projects'],['history','◷','Project History'],['teams','♧','Teams'],['services','◈','Services'],['enquiries','▤','Enquiries'],['reports','▥','Reports']];document.getElementById('sidebar').innerHTML=items.map(x=>`<div class="nav ${section===x[0]?'active':''}" data-go="${x[0]}"><span class="ico">${x[1]}</span>${x[2]}</div>${x[0]==='teams'&&section==='teams'?`<div class="subnav">${store.teams.map((t,i)=>`<div data-team="${i}">• Team-${i+1}: ${esc(t.name)}</div>`).join('')}</div>`:''}`).join('');document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>viewTeam(+el.dataset.team))}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}
function dashboard(){const total=store.teams.reduce((a,t)=>a+t.members.length,0),income=store.projects.reduce((a,p)=>a+Number(p.income||0),0),rev=store.projects.reduce((a,p)=>a+Number(p.revenue||0),0),done=store.projects.filter(p=>p.status==='Completed').length,not=store.projects.filter(p=>p.status!=='Completed').length;document.getElementById('content').innerHTML=`<div class="title"><div class="bigico">▥</div><div><h1>3FS Dashboard</h1><div>Creative management at a glance — every slot is custom editable</div></div></div><div class="cards"><div class="card purple"><div class="label">Total Team Members</div><div class="num">${total}</div></div><div class="card green"><div class="label">Clients</div><div class="num">${store.clients.length}</div></div><div class="card blue"><div class="label">Total Projects</div><div class="num">${store.projects.length}</div></div><div class="card orange"><div class="label">New Enquiries</div><div class="num">${store.enquiries.filter(x=>x.status==='New').length}</div></div></div><div class="cards"><div class="card green"><div class="label">Completed Projects</div><div class="num statusdone">${done}</div></div><div class="card orange"><div class="label">Not Completed / Processing</div><div class="num statusnot">${not}</div></div><div class="card blue"><div class="label">Total Income</div><div class="num money">${money(income)}</div></div><div class="card purple"><div class="label">Revenue Generated</div><div class="num money">${money(rev)}</div></div></div><section class="section"><div class="sectionhead"><h2>♧ Team Overview</h2><button class="add" id="manageTeams">Manage Teams</button></div><div class="overview">${store.teams.map((t,i)=>`<div class="mini" data-team="${i}"><b>Team-${i+1}: ${esc(t.name)}</b><strong>${t.members.length}</strong><small>Members</small></div>`).join('')}</div></section><section class="section"><div class="sectionhead"><h2>Project Status & Income</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" data-quick="projects">Edit Projects</button><button class="secondary" data-quick="history">All Project History</button></div></div><div class="notice">Completed: <b>${done}</b> · Processing / Not Completed: <b>${not}</b> · Total Income: <b class="money">${money(income)}</b> · Revenue Generated: <b class="money">${money(rev)}</b></div></section>`;document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>viewTeam(+el.dataset.team));document.getElementById('manageTeams').onclick=()=>go('teams');document.querySelectorAll('[data-quick]').forEach(el=>el.onclick=()=>go(el.dataset.quick==='history'?'history':el.dataset.quick))}
function historyPage(){const h=store.history||[];document.getElementById('content').innerHTML=`<div class="sectionhead"><div class="title"><div class="bigico">◷</div><div><h1>All Projects History</h1><div>Every project update, completion and revenue record</div></div></div><button class="secondary" id="clearHistory">Clear History</button></div><section class="section"><div class="notice">Automatic 3-day reporting snapshots are stored in this browser. ${store.reportSnapshots?.length||0} snapshot(s) saved.</div><div class="table"><div class="thead"><div>Date / Time</div><div>Action</div><div>Project / Record</div><div>Details</div></div>${h.length?h.slice().reverse().map(x=>`<div class="row"><div>${esc(x.time)}</div><div><span class="count">${esc(x.action)}</span></div><div><b>${esc(x.project||'')}</b></div><div><span class="sub">${esc(x.details||'')}</span></div></div>`).join(''):'<div class="row"><div>No history yet.</div><div></div><div></div><div></div></div>'}</div></section><section class="section"><h2>3-Day Reports</h2>${(store.reportSnapshots||[]).slice().reverse().map(x=>`<div class="historyline"><b>${esc(x.date)}</b><b>${x.projects} projects</b><span>Clients ${x.clients} · Completed ${x.completed} · Income ${money(x.income)} · Revenue ${money(x.revenue)}</span></div>`).join('')||'<div class="notice">The first snapshot will be created automatically after deployment.</div>'}</section>`;document.getElementById('clearHistory').onclick=()=>{if(confirm('Clear project history?')){store.history=[];persist();historyPage()}}}
function openRecordModal(type,i=-1){section=type;modalMode='record';editIndex=i;const c=configs[type],x=i<0?{}:store[type][i];document.getElementById('modalTitle').textContent=i<0?c.add:'Edit '+c.title.replace('3FS ','');document.getElementById('modalNotice').textContent='Custom editing is enabled for every field. Money fields feed the dashboard totals.';document.getElementById('form').innerHTML='<div class="grid2">'+c.fields.map((f,j)=>{let v=x[f[0]]??'';if(f[2].startsWith('select:')){let opts=f[2].split(':')[1].split(',');return `<div class="field"><label>${f[1]}</label><select id="f${j}">${opts.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`}return `<div class="field"><label>${f[1]}</label>${f[2]==='textarea'?`<textarea id="f${j}">${esc(v)}</textarea>`:`<input id="f${j}" type="${f[2]}" value="${esc(v)}" placeholder="Enter ${f[1]}">`}</div>`}).join('')+'</div>';showModal()}
function saveRecord(){const c=configs[section],obj={};c.fields.forEach((f,j)=>{let v=document.getElementById('f'+j).value.trim();obj[f[0]]=f[2]==='number'?(Number(v)||0):v});if(!obj[c.fields[0][0]])return alert('Please enter '+c.fields[0][1]+'.');if(editIndex<0)store[section].push(obj);else store[section][editIndex]=obj;store.history=store.history||[];if(section==='projects')store.history.push({time:new Date().toLocaleString('en-IN'),action:editIndex<0?'ADDED':'EDITED',project:obj.name,details:`Status: ${obj.status}; Income: ${money(obj.income)}; Revenue: ${money(obj.revenue)}`});persist();closeModal();nav();render();toast('Saved successfully')}
function rightPanel(){const c=store.clients,p=store.projects,t=store.teams,e=store.enquiries,income=p.reduce((a,x)=>a+Number(x.income||0),0),rev=p.reduce((a,x)=>a+Number(x.revenue||0),0),done=p.filter(x=>x.status==='Completed').length,not=p.length-done;document.getElementById('right').innerHTML=`<h2 style="margin:0;font-size:24px">▥ Reports</h2><div style="color:#aebbd0">Insights, income & performance</div><div class="report"><div class="metrics"><div class="metric">👥 Clients<b>${c.length}</b><span class="up">Editable names</span></div><div class="metric">▰ Projects<b>${p.length}</b><span class="up">${done} completed</span></div><div class="metric">♧ Team Members<b>${t.reduce((a,x)=>a+x.members.length,0)}</b><span class="up">Inner members</span></div><div class="metric">◎ Enquiries<b>${e.length}</b><span class="up">${e.filter(x=>x.status==='New').length} new</span></div><div class="metric">💰 Total Income<b class="money">${money(income)}</b><span class="up">From project entries</span></div><div class="metric">📈 Revenue Generated<b class="money">${money(rev)}</b><span class="up">Recorded revenue</span></div></div></div><div class="report"><h3 style="margin:0">Project Status</h3><div class="notice">Completed <b class="statusdone">${done}</b> · Not Completed / Processing <b class="statusnot">${not}</b></div></div><div class="report"><h3 style="margin:0">Projects by Service</h3><div class="donut"></div><div class="legend">${[...new Set(p.map(x=>x.service))].slice(0,6).map(s=>`<div>• ${esc(s)} — ${p.filter(x=>x.service===s).length}</div>`).join('')}</div></div><div class="report"><h3 style="margin:0">3-Day Reporting</h3><div class="notice">Snapshots: <b>${store.reportSnapshots?.length||0}</b><br>Last snapshot: ${store.reportSnapshots?.length?esc(store.reportSnapshots.at(-1).date):'Not yet created'}</div></div>`}
function takeSnapshot(){store.reportSnapshots=store.reportSnapshots||[];const last=store.reportSnapshots.at(-1),now=Date.now();if(!last||now-new Date(last.date).getTime()>=3*24*60*60*1000){const p=store.projects;store.reportSnapshots.push({date:new Date().toLocaleString('en-IN'),projects:p.length,clients:store.clients.length,completed:p.filter(x=>x.status==='Completed').length,income:p.reduce((a,x)=>a+Number(x.income||0),0),revenue:p.reduce((a,x)=>a+Number(x.revenue||0),0)});persist()}}
function applyTheme(name){const r=document.documentElement;const themes={midnight:['#050b15','#0b1628','#f5b51b','#ffd13b'],aurora:['#07151a','#0c2530','#19d3ae','#7df5d5'],royal:['#0b0818','#17102d','#b78cff','#e0c2ff'],sunset:['#160b08','#2a1510','#ff8a3d','#ffd08a']};const t=themes[name]||themes.midnight;r.style.setProperty('--bg',t[0]);r.style.setProperty('--panel',t[1]);r.style.setProperty('--gold',t[2]);r.style.setProperty('--gold2',t[3]);localStorage.setItem('3fsTheme',name)}
function notifications(){store.notifications=store.notifications||[{id:1,title:'Apply for Services',message:'New service application received. Open Enquiries to review.',read:false,time:new Date().toLocaleString('en-IN')}];const unread=store.notifications.filter(n=>!n.read).length;document.getElementById('notifyBadge').textContent=unread;document.getElementById('notifyPanel').innerHTML=`<h3>🔔 Notifications</h3>${store.notifications.slice().reverse().map(n=>`<div class="nitem"><b>${esc(n.title)}</b><br><span>${esc(n.message)}</span><small style="display:block;color:#8fa0b7">${esc(n.time||'')}</small></div>`).join('')}<button class="secondary" id="markRead" style="margin-top:8px">Mark all read</button>`;document.getElementById('markRead').onclick=()=>{store.notifications.forEach(n=>n.read=true);persist();notifications()}}
function initEnhanced(){takeSnapshot();applyTheme(localStorage.getItem('3fsTheme')||'midnight');notifications();document.getElementById('notifyBtn').onclick=()=>document.getElementById('notifyPanel').classList.toggle('show');document.getElementById('themeBtn').onclick=()=>document.getElementById('themeMenu').classList.toggle('show');document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.theme);document.getElementById('themeMenu').classList.remove('show')})}
function openPortal(){location.href='portal.html'}
function logout(){sessionStorage.removeItem('3fsLoggedIn');location.href='portal.html'}
document.getElementById('portalBtn').onclick=openPortal;document.getElementById('logoutBtn').onclick=logout;
if(sessionStorage.getItem('3fsLoggedIn')!=='1'){location.href='portal.html'}else{initEnhanced();nav();render()}
</script></body></html>
