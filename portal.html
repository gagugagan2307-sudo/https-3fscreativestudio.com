<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3FS Creative Studio — Portal</title><style>body{margin:0;background:radial-gradient(circle at 50% 10%,#172b4a,#050b15 55%);color:#fff;font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,90%);background:#0b1628;border:1px solid #34445f;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0009;text-align:center}.box img{width:90px;height:90px;object-fit:contain;border-radius:50%;background:#fff}.box h1{margin:12px 0 4px}.gold{color:#ffc83d}.field{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #34445f;border-radius:10px;background:#07101d;color:#fff}.btn{display:block;width:100%;padding:13px;margin-top:14px;border:0;border-radius:10px;background:#f5b51b;color:#111;font-weight:800;cursor:pointer}.back{background:#17253b;color:#fff}.msg{min-height:20px;color:#ff8b8b;font-size:13px;margin-top:8px}</style>
<style id="threefs-bg-picker-css">
#threefs-bg-picker{position:fixed;right:16px;bottom:16px;z-index:9999;width:250px;padding:14px;border:1px solid rgba(255,204,64,.35);border-radius:16px;background:rgba(7,14,27,.94);backdrop-filter:blur(14px);box-shadow:0 16px 45px rgba(0,0,0,.4);color:#fff;font-family:Arial,sans-serif}
#threefs-bg-picker .bg-title{font-weight:800;margin-bottom:9px;color:#ffd34d}
#threefs-bg-picker select{width:100%;padding:9px;border-radius:9px;border:1px solid #3a4a63;background:#101d31;color:#fff}
#threefs-bg-picker .bg-note{font-size:11px;color:#9facbf;margin-top:7px}
body.threefs-galaxy{background:radial-gradient(circle at 15% 15%,#38216e 0,transparent 28%),radial-gradient(circle at 85% 10%,#164b7c 0,transparent 25%),radial-gradient(circle at 55% 85%,#26104f 0,transparent 30%),#030712!important}
body.threefs-waves{background:linear-gradient(125deg,#031b2b,#073a55 42%,#07142d 70%,#1b0c3b)!important}
body.threefs-neon{background:radial-gradient(circle at 20% 30%,rgba(124,58,237,.5),transparent 27%),radial-gradient(circle at 85% 65%,rgba(14,165,233,.38),transparent 28%),#050816!important}
body.threefs-glass{background:linear-gradient(135deg,#07111f,#17233c 50%,#10162b)!important}
body.threefs-gold{background:radial-gradient(circle at 70% 0,rgba(245,181,27,.18),transparent 28%),linear-gradient(135deg,#05080e,#15110a 55%,#070b12)!important}
body.threefs-gradient{background:linear-gradient(120deg,#071c2c,#24104a 45%,#071f2b 75%,#381026)!important}
body.threefs-future{background:radial-gradient(circle at 10% 20%,rgba(0,229,255,.28),transparent 20%),radial-gradient(circle at 90% 20%,rgba(255,0,153,.22),transparent 22%),linear-gradient(135deg,#02050c,#111827 45%,#070313)!important}
body.threefs-studio{background:linear-gradient(145deg,#02050a,#0a101b 50%,#111827)!important}
@media(max-width:600px){#threefs-bg-picker{right:8px;bottom:8px;width:220px}}
</style>

</head><body><div class="box"><img src="3fs-logo.jpg" alt="3FS Creative Studio"><h1>3FS Creative Studio</h1><p class="gold">Create • Connect • Grow</p><p>Secure Multi-User Team Portal</p><input id="u" class="field" placeholder="Team member email" autocomplete="email"><input id="pw" class="field" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Sign In to 3FS Portal</button><button class="btn back" onclick="signup()">Create Team Account</button><button class="btn back" onclick="resetPw()">Forgot Password</button><div id="msg" class="msg"></div><button class="btn back" onclick="location.href='index.html'">Open Dashboard</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script>
<script>
async function login(){const email=document.getElementById('u').value.trim(),p=document.getElementById('pw').value,msg=document.getElementById('msg');msg.textContent='';if(!window.threefsAuth||!(await window.threefsAuth.ready())){msg.textContent='Connect Supabase first. Authentication is required.';return}if(!email||!p){msg.textContent='Enter email and password.';return}const {error}=await window.threefsAuth.signIn(email,p);if(error)msg.textContent=error.message;else location.href='index.html'}
async function signup(){const email=prompt('New user email:');if(!email)return;const name=prompt('Full name:')||'3FS Team Member';const p=prompt('Create password (minimum 6 characters):');if(!p)return;const {data,error}=await window.threefsAuth.signUp(email.trim(),p,name.trim());document.getElementById('msg').textContent=error?error.message:(data.session?'Account created. You can sign in.':'Account created. Check email if confirmation is enabled.');}
async function resetPw(){const email=document.getElementById('u').value.trim();if(!email)return document.getElementById('msg').textContent='Enter your email first.';const {error}=await window.threefsAuth.resetPassword(email);document.getElementById('msg').textContent=error?error.message:'Password reset email sent.';}
</script>
<div id="threefs-bg-picker">
  <div class="bg-title">🎨 3FS Creative Background</div>
  <select id="threefs-bg-select">
    <option value="gold">🟡 Premium 3FS Gold</option>
    <option value="galaxy">🌌 Galaxy</option>
    <option value="waves">🌊 Digital Waves</option>
    <option value="neon">💜 Neon</option>
    <option value="glass">💎 Glass Studio</option>
    <option value="gradient">🌈 Creative Gradient</option>
    <option value="future">⚡ Futuristic</option>
    <option value="studio">🖤 Studio Dark</option>
  </select>
  <div class="bg-note">Your choice is saved on this device.</div>
</div>
<script id="threefs-bg-picker">
(function(){
  const key='threefsBackground';
  const select=document.getElementById('threefs-bg-select');
  const names=['gold','galaxy','waves','neon','glass','gradient','future','studio'];
  function apply(v){
    names.forEach(n=>document.body.classList.remove('threefs-'+n));
    document.body.classList.add('threefs-'+v);
    localStorage.setItem(key,v);
  }
  const saved=localStorage.getItem(key)||'gold';
  select.value=saved; apply(saved);
  select.addEventListener('change',e=>apply(e.target.value));
})();
</script>

</body></html>
