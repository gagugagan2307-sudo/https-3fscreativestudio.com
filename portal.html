<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3FS Creative Studio — Portal</title><style>body{margin:0;background:radial-gradient(circle at 50% 0,#142643,#050b15 50%,#03070e);color:#fff;font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(430px,90%);background:#0b1628;border:1px solid #34445f;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0008;text-align:center}.box img{width:100px;height:100px;object-fit:contain;border-radius:50%;background:#fff}.box h1{margin:12px 0 4px}.gold{color:#ffc83d;font-weight:700}.field{text-align:left;margin:13px 0}.field label{display:block;margin-bottom:6px;color:#c8d3e5}.field input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #34445f;background:#07101d;color:#fff}.btn{display:block;width:100%;padding:13px;margin-top:14px;border:0;border-radius:10px;background:#f5b51b;color:#111;font-weight:800;cursor:pointer}.back{background:#17253b;color:#fff}.error{display:none;background:#451522;border:1px solid #9b263c;color:#ffd6dc;padding:10px;border-radius:9px;margin-top:12px}.hint{color:#8fa0b7;font-size:12px;margin-top:16px}</style></head><body><div class="box"><img src="3fs-logo.jpg" alt="3FS Creative Studio"><h1>3FS Creative Studio</h1><p class="gold">Create • Connect • Grow</p><p>Secure 3FS Management Portal</p><div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="Enter username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><div id="error" class="error">Invalid username or password.</div><button class="btn" id="login">Login to 3FS Dashboard</button><button class="btn back" onclick="location.href='index.html'">Back to Dashboard</button><div class="hint">Authorized 3FS admin access only.</div></div><script>const U='3FS',P='3FS@media';if(sessionStorage.getItem('3fsLoggedIn')==='1'){document.getElementById('username').value=U}function login(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(u===U&&p===P){sessionStorage.setItem('3fsLoggedIn','1');location.href='index.html'}else{document.getElementById('error').style.display='block'}}document.getElementById('login').onclick=login;document.addEventListener('keydown',e=>{if(e.key==='Enter')login()})</script></body></html>
